# Weekly dependency updates, grouped so each ecosystem opens at most one
# minor-and-patch PR a week. Security updates still arrive individually.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-react 7.37 declares peer eslint ^9.7, so `npm ci`
      # fails on ESLint 10. Drop this once the plugin supports 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
